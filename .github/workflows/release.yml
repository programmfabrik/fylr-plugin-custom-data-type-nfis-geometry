# Release workflow for this PUBLIC fylr plugin.
#
# A manager publishes a release on the
# GitHub release page (tag vX.Y.Z); this builds the plugin zip and attaches it.
# The asset URL — https://github.com/<org>/<repo>/releases/latest/download/<repo>.zip
# — is what fylr installs from, so the release must be PUBLISHED, not draft
# (a draft's assets are not reachable under releases/latest).
name: Release

on:
  release:
    types:
      - published
      - edited

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # a plugin repo has no go.mod for the dependency cache to key on
          cache: false

      - name: Build and package
        run: make zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Attach plugin zip to the release
        uses: softprops/action-gh-release@v3
        with:
          # fylr-build-plugin names the zip after the plugin, not after the
          # repository, and the two are not always the same. Attaching the
          # glob keeps the workflow out of the naming rule.
          files: |
            build/*.zip

      # releases/latest skips prereleases: the newest published release,
      # prerelease or not, also goes to GitHub Pages as <repo>-prerelease.zip,
      # the "plugin prerelease url" of the plugins sheet
      - name: Prepare GitHub Pages upload
        run: |
          mkdir -p public
          cp build/${{ github.event.repository.name }}.zip \
             public/${{ github.event.repository.name }}-prerelease.zip

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show the prerelease url
        run: |
          echo "prerelease url: ${PAGE_URL%/}/${{ github.event.repository.name }}-prerelease.zip" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
