# Release workflow for this PUBLIC fylr plugin.
#
# A manager publishes a release on the
# GitHub release page (tag vX.Y.Z); this builds the plugin zip and attaches it.
# The asset URL — https://github.com/<org>/<repo>/releases/latest/download/<repo>.zip
# — is what fylr installs from, so the release must be PUBLISHED, not draft
# (a draft's assets are not reachable under releases/latest).
name: Release

on:
  release:
    types:
      - published
      - edited

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # a plugin repo has no go.mod for the dependency cache to key on
          cache: false

      - name: Build and package
        run: make zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Attach plugin zip to the release
        uses: softprops/action-gh-release@v3
        with:
          # fylr-build-plugin names the zip after the plugin, not after the
          # repository, and the two are not always the same. Attaching the
          # glob keeps the workflow out of the naming rule.
          files: |
            build/*.zip
